[workspace]
resolver = "2"
members = [
    "crates/simoder-core",
    "crates/simoder-formats",
    "crates/simoder-mods",
    "crates/simoder-scripting",
    "crates/simoder-crash",
    "crates/simoder-d3d9",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dbpf = { git = "https://github.com/FluffyChi-Xing/fluffy-open-scp", rev = "42fd54a9390fa2fa354330cdd1451f5aa3e07538" }
sc-properties = { git = "https://github.com/FluffyChi-Xing/fluffy-open-scp", rev = "42fd54a9390fa2fa354330cdd1451f5aa3e07538" }
sc-format = { git = "https://github.com/FluffyChi-Xing/fluffy-open-scp", rev = "42fd54a9390fa2fa354330cdd1451f5aa3e07538" }
rw4 = { git = "https://github.com/FluffyChi-Xing/fluffy-open-scp", rev = "42fd54a9390fa2fa354330cdd1451f5aa3e07538" }
goblin = { version = "0.9", default-features = false, features = ["pe32", "std", "alloc"] }
anstyle = "1.0"
gltf = { version = "1", default-features = false }
mlua = { version = "0.12", features = ["luau", "vendored", "send", "serde"] }
oxilangtag = "0.1"
parking_lot = "0.12"
png = "0.18"
relative-path = "2"
rquickjs = { version = "0.14", default-features = false, features = ["std", "classes", "parallel"] }
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
slotmap = "1"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon = "0.3"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
walkdir = "2"

[profile.release]
strip = true
lto = true
