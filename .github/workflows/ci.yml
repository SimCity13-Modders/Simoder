name: Build and test Simoder Rust runtime
on:
  push:
    branches: [main, master, u4-u5-development]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Install i686-pc-windows-msvc target
        run: rustup target add i686-pc-windows-msvc
      - name: Run Clippy on x86_64 and i686-pc-windows-msvc
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target i686-pc-windows-msvc -- -D warnings
      - name: Run unit and integration tests on x86_64 and i686-pc-windows-msvc
        run: |
          cargo test --workspace
          cargo test --workspace --target i686-pc-windows-msvc
      - name: Build integrated 32-bit x86 d3d9.dll release artifact
        run: |
          cargo build --release --target i686-pc-windows-msvc -p simoder-d3d9
          New-Item -ItemType Directory -Force -Path build/staged/licenses | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/simoder_d3d9.dll build/staged/d3d9.dll
          Copy-Item LICENSE build/staged/licenses/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md build/staged/licenses/THIRD_PARTY_NOTICES.md
          $hash = (Get-FileHash build/staged/d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *d3d9.dll" | Set-Content -Path build/staged/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: simoder-windows-x86
          path: build/staged
          if-no-files-found: error
