name: Build and test Simoder runtime
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Enforce runtime repository ownership
        run: |
          python tests/repository_policy_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository policy tests failed' }
          python tools/repository/check_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository ownership policy failed' }
      - name: Configure integrated x86 runtime
        run: cmake --preset vs2022-x86
      - name: Build runtime and synthetic acceptance tests
        run: cmake --build --preset vs2022-release
      - name: Test runtime, embedded Luau, services and graphics bootstrap
        run: ctest --preset vs2022-release
      - name: Stage only runtime and legal notices
        run: cmake --install build/vs2022 --config Release --prefix build/staged
      - name: Verify one-DLL distribution and checksum
        run: python tools/distribution/check_runtime.py build/staged
      - name: Test rejection of modified or excessive distribution payloads
        run: python tests/distribution_tests.py build/staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: simoder-windows-x86
          path: build/staged
          if-no-files-found: error
